<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#2F5BEA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1E66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#shine)"/>

  <g transform="translate(0 -52)">
  <!-- address bar -->
  <g filter="url(#shadow)">
    <rect x="64" y="190" width="384" height="132" rx="66" fill="#FFFFFF"/>
  </g>

  <!-- globe -->
  <g transform="translate(130 256)" fill="none" stroke="#2F5BEA" stroke-width="9" stroke-linecap="round">
    <circle r="30"/>
    <ellipse rx="13" ry="30"/>
    <path d="M -30 0 H 30"/>
  </g>

  <!-- typed text + inline autocomplete selection + caret -->
  <rect x="182" y="240" width="76" height="32" rx="10" fill="#1B2A4A"/>
  <rect x="264" y="232" width="112" height="48" rx="12" fill="#BFD4FF"/>
  <rect x="270" y="240" width="88" height="32" rx="10" fill="#5B7FD6"/>
  <rect x="262" y="226" width="7" height="60" rx="3.5" fill="#2F5BEA"/>

  <!-- enter key -->
  <g fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 352 380 V 412 H 196"/>
    <path d="M 226 382 L 196 412 L 226 442"/>
  </g>
  </g>
</svg>
